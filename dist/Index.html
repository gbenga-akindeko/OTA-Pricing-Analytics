<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finchglow Finance Portal</title>
  <script>
    try {
      var savedTheme = window.localStorage.getItem('fp_theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) { /* storage blocked: follow the device setting */ }
  </script>
  <style>
  :root {
    color-scheme: light;
    /* Finchglow Holdings brand */
    --fg-cyan: #00aeef;
    --fg-blue: #1689ba;
    --fg-blue-deep: #0d6a94;
    --fg-navy: #0a4a6b;
    --fg-plum: #7b2d5e;
    --fg-red: #a50b1f;
    --fg-green: #00a651;
    --fg-orange: #f7901e;

    --bg: #f4f8fb;
    --surface: #ffffff;
    --surface-2: #f7fafc;
    --surface-tint: #e8f6fd;
    --border: #dfe7ee;
    --border-strong: #c5d3de;
    --text: #0f1b24;
    --text-2: #4a5a67;
    --muted: #7a8894;
    --primary: #0d6a94;
    --primary-hover: #0a5a7e;
    --primary-text: #ffffff;
    --focus: #00aeef;
    --danger: #b3261e;
    --danger-bg: #fdecea;
    --ok: #0b7a3e;
    --ok-bg: #e6f6ec;
    --warn-bg: #fff6e5;
    --warn-border: #f7901e;
    --up: #0d6a94;
    --down: #7b2d5e;
    --shadow: 0 1px 2px rgba(15, 27, 36, .06), 0 4px 16px rgba(15, 27, 36, .05);
    --radius: 12px;
    --series-1: #1689ba;
    --series-2: #e07a10;
    --series-3: #8e3a6f;
    --grid: #e6edf2;
    --logo-plate: transparent;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b141b;
      --surface: #13202b;
      --surface-2: #172633;
      --surface-tint: #10324a;
      --border: #22384a;
      --border-strong: #2f4b61;
      --text: #e9f1f6;
      --text-2: #b4c3cf;
      --muted: #8597a5;
      --primary: #1f9bd4;
      --primary-hover: #39abe0;
      --primary-text: #04131c;
      --danger: #ff8a80;
      --danger-bg: #3a1a1a;
      --ok: #5fd08f;
      --ok-bg: #12301f;
      --warn-bg: #33270f;
      --up: #5cc3ef;
      --down: #e08ac0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --series-1: #1f8fc4;
      --series-2: #d9781c;
      --series-3: #b45a92;
      --grid: #1f3242;
      --logo-plate: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b141b; --surface: #13202b; --surface-2: #172633; --surface-tint: #10324a;
    --border: #22384a; --border-strong: #2f4b61; --text: #e9f1f6; --text-2: #b4c3cf; --muted: #8597a5;
    --primary: #1f9bd4; --primary-hover: #39abe0; --primary-text: #04131c;
    --danger: #ff8a80; --danger-bg: #3a1a1a; --ok: #5fd08f; --ok-bg: #12301f; --warn-bg: #33270f;
    --up: #5cc3ef; --down: #e08ac0; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --series-1: #1f8fc4; --series-2: #d9781c; --series-3: #b45a92; --grid: #1f3242; --logo-plate: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  /* Multi colour stripe taken from the logo */
  .brand-stripe {
    height: 4px;
    background: linear-gradient(90deg, var(--fg-cyan) 0 40%, var(--fg-plum) 40% 55%, var(--fg-red) 55% 65%, var(--fg-green) 65% 80%, var(--fg-orange) 80% 100%);
  }

  /* Logo */
  .logo { display: inline-flex; align-items: center; background: var(--logo-plate); border-radius: 8px; padding: 4px 6px; }
  .logo img { display: block; height: 40px; width: auto; max-width: 100%; }
  .login-body .logo img { height: 54px; }
  .wordmark { display: inline-flex; flex-direction: column; line-height: 1; font-weight: 800; font-style: italic; letter-spacing: -.01em; }
  .wordmark .w-top { font-size: 26px; }
  .wordmark .w-bot { font-size: 10px; font-style: normal; font-weight: 700; letter-spacing: .62em; color: #0f1b24; margin-top: 4px; padding-left: 2px; }
  .wordmark .c1 { color: var(--fg-cyan); } .wordmark .c2 { color: var(--fg-plum); } .wordmark .c3 { color: var(--fg-red); }
  .wordmark .c4 { color: var(--fg-green); } .wordmark .c5 { color: var(--fg-orange); }

  /* Login */
  .login-wrap {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(0, 174, 239, .18), transparent 60%),
      radial-gradient(900px 400px at 110% 110%, rgba(247, 144, 30, .12), transparent 60%),
      var(--bg);
  }
  .login-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .login-body { padding: 28px; }
  .login-body h1 { font-size: 20px; margin: 20px 0 4px; }
  .login-body p.sub { margin: 0 0 20px; color: var(--text-2); }
  .login-foot { padding: 14px 28px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }

  /* App shell */
  .shell { display: grid; grid-template-columns: 256px 1fr; min-height: calc(100vh - 4px); }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: calc(100vh - 4px); overflow-y: auto; }
  .sidebar .brand { padding: 18px 18px 10px; }
  .sidebar .portal-name { font-size: 12px; color: var(--text-2); padding: 0 20px 12px; border-bottom: 1px solid var(--border); }
  .nav { padding: 10px 10px 20px; flex: 1; }
  .nav h6 { margin: 16px 10px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px;
    background: transparent; cursor: pointer; text-align: left; color: var(--text-2); font-weight: 500;
  }
  .nav button svg { width: 18px; height: 18px; flex: none; }
  .nav button:hover { background: var(--surface-2); color: var(--text); }
  .nav button.active { background: var(--surface-tint); color: var(--primary); font-weight: 600; box-shadow: inset 3px 0 0 var(--fg-cyan); }
  .nav .soon { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 99px; background: var(--warn-bg); color: #9a5b00; }
  :root[data-theme="dark"] .nav .soon { color: #f7b45e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav .soon { color: #f7b45e; } }
  .side-foot { padding: 12px 16px 12px 72px; min-height: 76px; display: flex; align-items: center; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }

  /* Light / dark switch, floating bottom left */
  .theme-toggle {
    position: fixed; left: 16px; bottom: 16px; z-index: 45;
    width: 48px; height: 48px; border-radius: 50%; padding: 0;
    display: grid; place-items: center; cursor: pointer;
    background: var(--surface); color: var(--primary);
    border: 1px solid var(--border-strong);
    box-shadow: 0 4px 14px rgba(15, 27, 36, .18);
    transition: transform .15s ease, background .15s ease;
  }
  .theme-toggle:hover { transform: translateY(-2px); background: var(--surface-tint); }
  .theme-toggle:active { transform: none; }
  .theme-toggle svg { width: 22px; height: 22px; }
  @media print { .theme-toggle { display: none; } }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .topbar h2 { margin: 0; font-size: 18px; flex: 1; min-width: 0; }
  .btn.menu-btn { display: none; }
  .user-chip { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--fg-blue); color: #fff; font-weight: 700; font-size: 13px; }
  .user-meta { line-height: 1.2; }
  .user-meta b { display: block; font-size: 13px; }
  .user-meta span { font-size: 11px; color: var(--muted); }
  .content { padding: 24px 28px 48px; max-width: 1280px; width: 100%; }

  /* Building blocks */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .card-h h3 { margin: 0; font-size: 15px; flex: 1; min-width: 0; }
  .card-b { padding: 18px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stack > * + * { margin-top: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn svg { width: 16px; height: 16px; }

  label.field { display: block; }
  label.field > span { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
  .input, select.input, textarea.input { width: 100%; padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); }
  .input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
  textarea.input { min-height: 72px; resize: vertical; }
  .code-input { font-size: 24px; letter-spacing: .4em; text-align: center; font-weight: 700; }
  .check { display: flex; gap: 8px; align-items: center; }

  .chips { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
  .chips button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; font-weight: 600; color: var(--text-2); }
  .chips button + button { border-left: 1px solid var(--border); }
  .chips button.on { background: var(--primary); color: var(--primary-text); }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .badge.bad { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
  .badge.warn { background: var(--warn-bg); color: #9a5b00; border-color: transparent; }
  .badge.info { background: var(--surface-tint); color: var(--primary); border-color: transparent; }

  .alert { padding: 10px 14px; border-radius: 8px; border-left: 3px solid var(--warn-border); background: var(--warn-bg); font-size: 13px; }
  .alert.error { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
  .alert.info { border-color: var(--fg-cyan); background: var(--surface-tint); }

  /* Stat tiles */
  .tile { padding: 16px 18px; }
  .tile .label { font-size: 12px; color: var(--text-2); font-weight: 600; }
  .tile .value { font-size: 28px; font-weight: 700; margin-top: 4px; line-height: 1.15; }
  .tile .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .tile.accent { border-top: 3px solid var(--fg-cyan); }
  .delta { font-weight: 700; font-size: 12px; white-space: nowrap; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--muted); }

  /* Rate board */
  .cur-card .card-h { background: linear-gradient(90deg, var(--surface-tint), transparent); }
  .cur-code { font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--primary); }
  .rate-line { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 18px; border-top: 1px solid var(--border); }
  .rate-line:first-of-type { border-top: 0; }
  .rate-line .cat { color: var(--text-2); font-weight: 600; font-size: 13px; }
  .rate-line .val { font-size: 22px; font-weight: 700; text-align: right; }
  .rate-line .sub { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .rate-line.stale .val { color: var(--muted); }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.t td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t td.r, table.t th.r { text-align: right; }
  table.t tr.void td { color: var(--muted); text-decoration: line-through; }
  table.t tr.void td.keep { text-decoration: none; }
  .details { max-width: 420px; word-break: break-word; color: var(--text-2); font-size: 12px; }

  /* Users & access grid */
  .perm-legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 24px; font-size: 13px; color: var(--text-2); }
  .perm-legend b { color: var(--text); }
  table.perm-table th.c, table.perm-table td.c { text-align: center; width: 92px; }
  table.perm-table td { vertical-align: middle; }
  .perm-box { width: 18px; height: 18px; accent-color: var(--fg-orange); cursor: pointer; }
  .perm-box:disabled { cursor: not-allowed; opacity: .6; }
  .tick { color: var(--primary); font-weight: 800; font-size: 17px; }
  table.perm-table tr.is-blocked td:first-child b { text-decoration: line-through; color: var(--muted); }
  @media (max-width: 860px) { .perm-legend { grid-template-columns: 1fr; } }

  /* Publish form */
  .pub-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .pub-line { display: grid; grid-template-columns: minmax(0, 1fr) 150px 120px; gap: 12px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--border); }
  .pub-line .input { text-align: right; font-weight: 700; font-size: 16px; }
  .pub-line .was { font-size: 12px; color: var(--muted); text-align: right; }
  .preview { white-space: pre-wrap; font: 13px/1.55 ui-monospace, Consolas, Menlo, monospace; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 0; }
  .sticky { position: sticky; top: 76px; }

  /* Chart */
  .chart-box { position: relative; height: 320px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

  /* Coming soon */
  .soon-hero { padding: 36px; text-align: center; }
  .soon-hero .icon { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; margin: 0 auto 14px; background: var(--surface-tint); color: var(--primary); }
  .soon-hero ul { text-align: left; max-width: 460px; margin: 16px auto 0; color: var(--text-2); }

  /* Modal and toast */
  .modal-bg { position: fixed; inset: 0; background: rgba(5, 15, 22, .5); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal { width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
  .modal .card-b { display: grid; gap: 12px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--border); }
  .toast-host { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; max-width: calc(100vw - 32px); }
  .toast { padding: 12px 16px; border-radius: 10px; background: var(--text); color: var(--surface); box-shadow: var(--shadow); font-weight: 600; max-width: 380px; }
  .toast.error { background: var(--danger); color: #fff; }

  .loading { padding: 48px; text-align: center; color: var(--muted); }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--fg-cyan); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { padding: 32px; text-align: center; color: var(--muted); }

  @media (max-width: 1100px) {
    .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pub-grid { grid-template-columns: 1fr; }
    .sticky { position: static; }
  }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; z-index: 40; transform: translateX(-100%); transition: transform .2s; height: 100vh; box-shadow: 0 0 40px rgba(0, 0, 0, .2); }
    .sidebar.open { transform: none; }
    .btn.menu-btn { display: inline-flex; }
    .topbar { padding: 12px 16px; }
    .content { padding: 16px 16px 40px; }
    .g2, .g3 { grid-template-columns: 1fr; }
    .user-meta { display: none; }
    .pub-line { grid-template-columns: 1fr 130px; }
    .pub-line .was { grid-column: 1 / -1; text-align: left; }
  }
  @media (max-width: 520px) {
    .g4 { grid-template-columns: 1fr; }
    .tile .value { font-size: 24px; }
    .chart-box { height: 260px; }
  }
</style>
</head>
<body>
  <div class="brand-stripe"></div>
  <div id="app"><div class="loading"><span class="spinner"></span></div></div>
  <div id="toasts" class="toast-host" aria-live="polite"></div>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <script>
(function () {
  'use strict';

  var S = { token: null, boot: null, config: null, view: 'dashboard', charts: [], fl: { days: 30, currency: null }, audit: { category: '', q: '', from: '', to: '', tab: 'activity' } };
  var app = document.getElementById('app');

  /* ---------- small helpers ---------- */
  var store = {
    get: function (k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.sessionStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
    del: function (k) { try { window.sessionStorage.removeItem(k); } catch (e) { /* storage blocked */ } }
  };
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmt(n) {
    if (n === null || n === undefined || n === '' || isNaN(Number(n))) return '-';
    var num = Number(n);
    var fixed = Math.round(num * 100) % 100 === 0 ? num.toFixed(0) : num.toFixed(2);
    var p = fixed.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return p.join('.');
  }
  function pct(n) { return n === null || n === undefined ? '-' : (n > 0 ? '+' : '') + Number(n).toFixed(2) + '%'; }
  function delta(change, opts) {
    opts = opts || {};
    if (change === null || change === undefined) return '<span class="delta flat">' + (opts.none || 'New') + '</span>';
    if (change === 0) return '<span class="delta flat">No change</span>';
    var up = change > 0;
    return '<span class="delta ' + (up ? 'up' : 'down') + '" title="' + (up ? 'Naira weaker' : 'Naira stronger') + '">' + (up ? '&#9650; +' : '&#9660; ') + fmt(change) + (opts.pct !== undefined && opts.pct !== null ? ' (' + pct(opts.pct) + ')' : '') + '</span>';
  }
  function initials(name) { return String(name || '?').split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join(''); }
  /** True when the signed in person has this permission. 'VIEW' is everyone. A list means any of them. */
  function can(perm) {
    if (!S.boot) return false;
    if (!perm || perm === 'VIEW') return true;
    if (Array.isArray(perm)) return perm.some(can);
    return !!(S.boot.user.perms && S.boot.user.perms[perm]);
  }
  function isoDay(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return isoDay(d); }
  function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function nowInput(tz) {
    try {
      var p = {};
      new Intl.DateTimeFormat('en-GB', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
        .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
      return p.year + '-' + p.month + '-' + p.day + 'T' + p.hour + ':' + p.minute;
    } catch (e) {
      var d = new Date();
      return isoDay(d) + 'T' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
  }
  function shortName(publishedBy) { return String(publishedBy || '').replace(/\s*<.*>$/, ''); }

  function api(action, payload) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) return resolve(r.data);
          var err = r || { error: 'No response from the server.' };
          if (err.code === 'AUTH' && action !== 'verifyCode') {
            signedOut(err.error);
          }
          reject(err);
        })
        .withFailureHandler(function (e) { reject({ error: (e && e.message) || String(e), code: 'NETWORK' }); })
        .api(S.token, action, payload || {});
    });
  }

  function toast(msg, isError) {
    var host = document.getElementById('toasts');
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(function () { el.remove(); }, isError ? 7000 : 4000);
  }
  function fail(e) { toast((e && e.error) || 'Something went wrong.', true); }

  function modal(opts) {

    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
      '<div class="card-h"><h3>' + esc(opts.title) + '</h3><button class="btn sm" data-x aria-label="Close">Close</button></div>' +
      '<form class="card-b" novalidate>' + opts.body + '<div class="alert error hidden" data-err></div></form>' +
      '<div class="modal-foot"><button class="btn" data-x>Cancel</button><button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" data-ok>' + esc(opts.ok || 'Save') + '</button></div></div>';
    document.body.appendChild(bg);
    var form = bg.querySelector('form');
    var okBtn = bg.querySelector('[data-ok]');
    var errBox = bg.querySelector('[data-err]');
    function close() { bg.remove(); }
    bg.addEventListener('click', function (ev) { if (ev.target === bg || ev.target.hasAttribute('data-x')) close(); });
    function submit(ev) {
      if (ev) ev.preventDefault();
      if (!opts.onOk) return close();
      okBtn.disabled = true;
      errBox.classList.add('hidden');
      Promise.resolve(opts.onOk(form)).then(function (keepOpen) { if (!keepOpen) close(); }).catch(function (e) {
        errBox.textContent = (e && e.error) || 'Something went wrong.';
        errBox.classList.remove('hidden');
      }).then(function () { okBtn.disabled = false; });
    }
    okBtn.addEventListener('click', submit);
    form.addEventListener('submit', submit);

  function emailBadge(status) {
    var s = String(status || '');
    if (/^SENT/.test(s)) return '<span class="badge ok">Emailed ' + esc(s.replace('SENT ', '')) + '</span>';
    if (/^PARTIAL/.test(s)) return '<span class="badge warn">Partly emailed ' + esc(s.replace('PARTIAL ', '')) + '</span>';
    if (/^FAILED/.test(s)) return '<span class="badge bad">Email failed</span>';
    if (s === 'NO RECIPIENTS') return '<span class="badge warn">No recipients set up</span>';

  VIEWS.fluctuations = function (el) {

      var g = fl.groups.filter(function (x) { return x.currency === S.fl.currency; })[0];
      var windows = { 7: '7 days', 30: '30 days', 90: '90 days', 180: '6 months', 365: '1 year' };

      var head = g ? (g.series.filter(function (s) { return s.current !== null; })[0] || g.series[0]) : null;
      var tiles = head ? [
        ['Current &middot; ' + esc(head.category), '&#8358;' + fmt(head.current), head.markupOverBook !== null ? pct(head.markupOverBook) + ' over book rate (' + fmt(g.bookRate) + ')' : 'No book rate on file'],
        ['Change over ' + windows[fl.days], delta(head.change, { pct: head.changePct, none: '-' }), 'From ' + fmt(head.open) + ' to ' + fmt(head.current)],
        ['High / low', '<span class="num">' + fmt(head.high) + ' / ' + fmt(head.low) + '</span>', 'Range ' + (head.high !== null ? fmt(Math.round((head.high - head.low) * 100) / 100) : '-')],
        ['Rate changes', '<span class="num">' + head.moves + '</span>', head.biggestMove ? 'Biggest move ' + (head.biggestMove.change > 0 ? '+' : '') + fmt(head.biggestMove.change) + ' on ' + esc(head.biggestMove.label) : 'No moves in this period']
      ].map(function (t) { return '<div class="card tile accent"><div class="label">' + t[0] + '</div><div class="value">' + t[1] + '</div><div class="meta">' + t[2] + '</div></div>'; }).join('') : '';

          return '<button data-days="' + w + '" class="' + (w === fl.days ? 'on' : '') + '">' + windows[w] + '</button>';
        }).join('') + '</div><span class="spacer"></span><div class="chips" role="group" aria-label="Currency">' + fl.groups.map(function (x) {
          return '<button data-cur="' + esc(x.currency) + '" class="' + (x.currency === S.fl.currency ? 'on' : '') + '">' + esc(x.displayName) + '</button>';
        }).join('') + '</div></div>' +
        (g ? '<div class="grid g4" style="margin-bottom:16px">' + tiles + '</div>' +
          '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>' + esc(g.displayName) + ' ROE by category, daily close (NGN per ' + esc(g.currency) + ')</h3></div>' +
          '<div class="card-b"><div class="chart-box"><canvas id="fl-chart" aria-label="Daily closing ROE per category"></canvas></div>' +
          '<p class="muted small" style="margin:10px 0 0">The daily close is the last rate broadcast on or before that day. Gaps mean no rate had been published yet.</p></div></div>' : '<div class="empty card">No rate categories are set up.</div>') +
        '<div class="card"><div class="card-h"><h3>All currencies, ' + windows[fl.days] + '</h3><button class="btn sm" id="fl-csv">' + icon('download') + 'Export CSV</button></div>' +
        '<div class="table-wrap"><table class="t"><thead><tr><th>Currency</th><th>Category</th><th class="r">Start</th><th class="r">Current</th><th class="r">Change</th><th class="r">Change %</th><th class="r">High</th><th class="r">Low</th><th class="r">Moves</th><th>Biggest move</th><th class="r">Over book</th></tr></thead><tbody>' +
        rows.join('') + '</tbody></table></div>' +
        '<div class="card-b small muted">Book rates come from the Rate Log' + (fl.book ? ' (latest ' + esc(fl.book.label) + ')' : '') + '. "Over book" is how far the current ROE sits above that rate.</div></div>';

      el.querySelectorAll('[data-days]').forEach(function (b) { b.onclick = function () { S.fl.days = Number(b.getAttribute('data-days')); go('fluctuations'); }; });
      el.querySelectorAll('[data-cur]').forEach(function (b) { b.onclick = function () { S.fl.currency = b.getAttribute('data-cur'); go('fluctuations'); }; });
      document.getElementById('fl-csv').onclick = function () {

        fl.groups.forEach(function (gg) { gg.series.forEach(function (s) {
          out.push([gg.currency, s.category, s.open, s.current, s.change, s.changePct, s.high, s.low, s.moves, s.biggestMove ? s.biggestMove.change + ' on ' + s.biggestMove.label : '', s.markupOverBook]);
        }); });

  VIEWS.publish = function (el) {
    return Promise.all([api('current'), api('recipients')]).then(function (res) {
      if (!stillOn('publish')) return;
      var cur = res[0];
      var rec = res[1];
      var requestId = rid();
      var groups = cur.groups;

      el.innerHTML = '<form id="pub-form" novalidate><div class="pub-grid"><div class="stack">' +
        '<div class="card"><div class="card-b grid g2">' +
        '<label class="field"><span>Effective date and time (' + esc(S.boot.timezone) + ')</span><input class="input" type="datetime-local" name="effectiveAt" value="' + nowInput(S.boot.timezone) + '" required></label>' +
        '<div class="small muted" style="align-self:end">Boxes start with the current rates. Change what moved, and clear a box to leave that category out of this broadcast.</div></div></div>' +
        groups.map(function (g) {
          return '<div class="card"><div class="card-h"><h3>' + esc(g.displayName) + ' ROE</h3><span class="cur-code">' + esc(g.currency) + '/NGN</span></div>' +
            g.lines.map(function (l) {
              return '<div class="pub-line"><label for="r-' + esc(g.currency + l.category) + '">' + esc(l.category) + '</label>' +
                '<input class="input num" id="r-' + esc(g.currency + l.category) + '" data-cur="' + esc(g.currency) + '" data-cat="' + esc(l.category) + '" data-prev="' + (l.rate === null ? '' : l.rate) + '" inputmode="decimal" value="' + (l.rate === null ? '' : l.rate) + '" autocomplete="off">' +
                '<div class="was" data-was>' + (l.rate === null ? 'New' : 'Now ' + fmt(l.rate)) + '</div></div>';
            }).join('') + '</div>';
        }).join('') +
        '<div class="card"><div class="card-b stack">' +
        '<label class="field"><span>Note on the broadcast</span><textarea class="input" name="note" maxlength="500">' + esc(S.boot.validityNote) + '</textarea></label>' +
        '<label class="check"><input type="checkbox" name="sendEmail" checked> Email the heads of finance now (' + rec.subsidiaries.length + ' subsidiar' + (rec.subsidiaries.length === 1 ? 'y' : 'ies') + (rec.internalCopy.length ? ' plus ' + rec.internalCopy.length + ' internal cop' + (rec.internalCopy.length === 1 ? 'y' : 'ies') : '') + ')</label>' +
        (rec.subsidiaries.length ? '' : '<div class="alert">No active subsidiaries have a head of finance email yet.' + (can('SUBSIDIARIES') ? ' Add them under <a href="#" data-nav="subsidiaries">Subsidiaries</a>.' : ' Ask an administrator to add them.') + '</div>') +
        '<div class="row"><span class="spacer"></span><button class="btn primary" type="submit" id="pub-btn">' + icon('send') + 'Publish ROE</button></div>' +
        '</div></div></div>' +
        '<div class="stack sticky"><div class="card"><div class="card-h"><h3>Broadcast preview</h3><button class="btn sm" type="button" id="pv-copy">' + icon('copy') + 'Copy for WhatsApp</button></div>' +
        '<div class="card-b"><pre class="preview" id="pv"></pre></div></div>' +
        '<div class="card"><div class="card-h"><h3>Email goes to</h3></div><div class="card-b small">' +
        (rec.subsidiaries.length ? rec.subsidiaries.map(function (s) { return '<div style="margin-bottom:6px"><b>' + esc(s.name) + '</b><br><span class="muted">' + esc(s.headName ? s.headName + ', ' : '') + esc(s.email) + '</span></div>'; }).join('') : '<span class="muted">Nobody yet.</span>') +
        (rec.internalCopy.length ? '<div class="muted" style="margin-top:8px">Copy to: ' + esc(rec.internalCopy.join(', ')) + '</div>' : '') +
        '</div></div></div></div></form>';

      var form = document.getElementById('pub-form');
      var inputs = [].slice.call(form.querySelectorAll('input[data-cat]'));
      function collect() {
        return inputs.map(function (i) { return { currency: i.getAttribute('data-cur'), category: i.getAttribute('data-cat'), rate: i.value.replace(/,/g, '').trim() }; })
          .filter(function (r) { return r.rate !== ''; });
      }
      function refresh() {
        inputs.forEach(function (i) {
          var was = i.parentNode.querySelector('[data-was]');
          var prev = i.getAttribute('data-prev');
          var v = Number(i.value.replace(/,/g, ''));
          if (i.value.trim() === '') { was.innerHTML = '<span class="muted">Left out</span>'; return; }
          if (!isFinite(v) || v <= 0) { was.innerHTML = '<span class="delta down">Not a number</span>'; return; }
          if (prev === '') { was.innerHTML = 'New'; return; }
          var ch = Math.round((v - Number(prev)) * 100) / 100;
          was.innerHTML = ch === 0 ? 'No change' : delta(ch);
        });
        var rates = collect().filter(function (r) { return isFinite(Number(r.rate)) && Number(r.rate) > 0; }).map(function (r) { return { currency: r.currency, category: r.category, rate: Number(r.rate) }; });
        document.getElementById('pv').textContent = rates.length ? roeText(inputToWhen(form.effectiveAt.value), rates, form.note.value.trim()) : 'Enter at least one rate.';
      }
      form.addEventListener('input', refresh);
      refresh();
      document.getElementById('pv-copy').onclick = function () { copyText(document.getElementById('pv').textContent); };

      function send(confirmLarge) {
        var btn = document.getElementById('pub-btn');
        btn.disabled = true;
        return api('publish', {
          requestId: requestId, effectiveAt: form.effectiveAt.value, rates: collect(), note: form.note.value,
          sendEmail: form.sendEmail.checked, confirmLargeChange: !!confirmLarge
        }).then(function (r) {
          var msg = 'ROE published.';
          if (r.email) msg += r.email.total ? ' Emailed ' + r.email.sent + ' of ' + r.email.total + ' heads of finance.' : ' No email recipients are set up.';
          toast(msg, r.email && r.email.sent < r.email.total);
          go('dashboard');
        }).catch(function (e) {
          btn.disabled = false;
          if (e.code === 'CONFIRM_REQUIRED') {
            return confirmBox('Please double check these rates', '<p>' + esc(e.error) + '</p><ul>' + e.extra.warnings.map(function (w) { return '<li class="num">' + esc(w) + '</li>'; }).join('') + '</ul>', 'Yes, publish them').then(function (ok) { if (ok) return send(true); });
          }
          fail(e);
        });
      }
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var rates = collect();
        if (!rates.length) return toast('Enter at least one rate.', true);
        var who = form.sendEmail.checked ? (rec.subsidiaries.length + ' heads of finance will be emailed straight away.') : 'No email will be sent. You can resend from ROE history later.';
        confirmBox('Publish this ROE?', '<pre class="preview">' + esc(document.getElementById('pv').textContent) + '</pre><p class="small muted">' + esc(who) + '</p>', 'Publish').then(function (ok) { if (ok) send(false); });
      });
    });
  };

        if (!cols.some(function (c) { return c.currency === r.currency && c.category === r.category; })) cols.push({ currency: r.currency, displayName: r.currency, category: r.category });
      }); });

  VIEWS.book = function (el) {
    return api('bookRates').then(function (b) {
      if (!stillOn('book')) return;
      el.innerHTML = '<div class="grid g2" style="align-items:start">' +
        '<div class="card"><div class="card-h"><h3>Rate Log (book rates)</h3></div>' +
        (b.entries.length ? '<div class="table-wrap"><table class="t"><thead><tr><th>Effective date</th><th class="r">USD</th><th class="r">EUR</th><th class="r">GBP</th></tr></thead><tbody>' +
          b.entries.map(function (e) { return '<tr><td>' + esc(e.label) + '</td><td class="r num">' + fmt(e.usd) + '</td><td class="r num">' + fmt(e.eur) + '</td><td class="r num">' + fmt(e.gbp) + '</td></tr>'; }).join('') +
          '</tbody></table></div>' : '<div class="empty">No book rates yet.</div>') + '</div>' +
        (can('SET_RATE') ? '<div class="card"><div class="card-h"><h3>Add a book rate</h3></div><form class="card-b stack" id="book-form" novalidate>' +
          '<p class="small muted" style="margin:0">Works like the "currency conv" tab: type the USD rate and the USD cross rates from OANDA, and EUR and GBP are worked out as ROUNDDOWN(USD / cross, 2). You can also type EUR and GBP directly.</p>' +
          '<div class="grid g2"><label class="field"><span>Effective date</span><input class="input" type="date" name="date" value="' + isoDay(new Date()) + '"></label>' +
          '<label class="field"><span>USD (NGN)</span><input class="input num" name="usd" inputmode="decimal" placeholder="1348"></label>' +
          '<label class="field"><span>USD to EUR cross</span><input class="input num" name="usdToEur" inputmode="decimal" placeholder="0.88858"></label>' +
          '<label class="field"><span>or EUR (NGN)</span><input class="input num" name="eur" inputmode="decimal"></label>' +
          '<label class="field"><span>USD to GBP cross</span><input class="input num" name="usdToGbp" inputmode="decimal" placeholder="0.75499"></label>' +
          '<label class="field"><span>or GBP (NGN)</span><input class="input num" name="gbp" inputmode="decimal"></label></div>' +
          '<div class="alert info" id="book-pv">Enter the USD rate to see the result.</div>' +
          '<div class="row"><span class="spacer"></span><button class="btn primary" type="submit">Save to Rate Log</button></div></form></div>' : '') + '</div>';

      var form = document.getElementById('book-form');
      if (!form) return;
      function calc(direct, cross, usd) {
        if (direct.trim()) return Number(direct.replace(/,/g, ''));
        var c = Number(cross);
        return usd > 0 && c > 0 ? Math.floor(usd / c * 100) / 100 : null;
      }
      form.addEventListener('input', function () {
        var usd = Number(form.usd.value.replace(/,/g, ''));
        var eur = calc(form.eur.value, form.usdToEur.value, usd);
        var gbp = calc(form.gbp.value, form.usdToGbp.value, usd);

        api('addBookRate', { date: form.date.value, usd: form.usd.value.replace(/,/g, ''), eur: form.eur.value.replace(/,/g, ''), gbp: form.gbp.value.replace(/,/g, ''), usdToEur: form.usdToEur.value, usdToGbp: form.usdToGbp.value })
          .then(function () { toast('Book rate saved.'); go('book'); }).catch(fail);
      });
    });
  };

    RESEND_ROE: 'Resent ROE', TEST_EMAIL: 'Sent test email', ADD_USER: 'Added user', UPDATE_USER: 'Changed user', ADD_SUBSIDIARY: 'Added subsidiary',

    UPDATE_SETTINGS: 'Changed settings', REMOVE_USER: 'Removed user', ADD_BOOK_RATE: 'Added book rate', SETUP: 'Ran setup'
  };
  function auditDetails(raw) {
    if (!raw) return '';
    try {
      var o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        return Object.keys(o).map(function (k) {
          var v = o[k];
          return '<b>' + esc(k) + ':</b> ' + esc(Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? JSON.stringify(v) : v);
        }).join(' &middot; ');
      }
    } catch (e) { /* plain text */ }
    return esc(raw);
  }

  VIEWS.users = function (el) {
    return Promise.all([api('users'), api('subsidiaries').catch(function () { return { subsidiaries: [] }; })]).then(function (res) {

      var perms = d.permissions;
      var cols = perms.concat([{ key: 'BLOCKED', label: 'Blocked', help: 'Cannot open the portal at all.' }]);

        '<p class="small muted" style="margin:0 0 14px">Everyone on this list can sign in and see the rates, ROE history, fluctuations and book rates (view only). Tick a box to give someone more, or block them. Changes apply as soon as you press Save.</p>' +

        '<label class="field"><span>Full name (optional)</span><input class="input" name="name"></label>' +
        '<label class="field"><span>Subsidiary</span><input class="input" name="subsidiary" list="sub-list"><datalist id="sub-list"><option value="Holdings">' + subs.map(function (s) { return '<option value="' + esc(s.name) + '">'; }).join('') + '</datalist></label></div>' +
        '<div class="row" style="margin-top:12px">' + perms.map(function (p) { return '<label class="check"><input type="checkbox" name="p_' + p.key + '"> ' + esc(p.label) + '</label>'; }).join('') +
        '<span class="spacer"></span><button class="btn primary" type="submit">' + icon('plus') + 'Add person</button></div></div></form>';

      function rowHtml(u, i) {
        var cells;
        var actions;
        if (u.isMainAdmin) {
          cells = perms.map(function () { return '<td class="c"><span class="tick" aria-label="Yes">&#10003;</span></td>'; }).join('') + '<td class="c"><span class="muted">&mdash;</span></td>';
          actions = '<td class="r small muted">Always full access</td>';
        } else {
          cells = cols.map(function (c) {

            var lockedByAdmin = c.key !== 'ADMIN' && c.key !== 'BLOCKED' && u.perms.ADMIN;

            return '<td class="c"><input type="checkbox" class="perm-box" data-i="' + i + '" data-k="' + c.key + '" aria-label="' + esc(c.label + ' for ' + u.name) + '"' + (on || lockedByAdmin ? ' checked' : '') + (lockedByAdmin || self ? ' disabled' : '') + '></td>';
          }).join('');
          actions = '<td class="r" style="white-space:nowrap"><button class="btn sm primary" data-save="' + i + '" disabled>Save</button> <button class="btn sm danger" data-remove="' + i + '"' + (u.email === me ? ' disabled title="You cannot remove yourself"' : '') + '>Remove</button></td>';
        }
        var badge = u.isMainAdmin ? ' <span class="badge info">MAIN ADMIN</span>' : u.blocked ? ' <span class="badge bad">BLOCKED</span>' : '';
        var meta = esc(u.email) + (u.subsidiary ? ' &middot; ' + esc(u.subsidiary) : '') + (u.lastLoginLabel ? ' &middot; Last signed in ' + esc(u.lastLoginLabel) : ' &middot; Never signed in');
        return '<tr data-row="' + i + '" class="' + (u.blocked ? 'is-blocked' : '') + '"><td><b>' + esc(u.name) + '</b>' + badge + '<div class="small muted">' + meta + '</div></td>' + cells + actions + '</tr>';
      }

      el.innerHTML = legend + add +
        '<div class="card"><div class="card-h"><input class="input" id="u-q" style="flex:1;min-width:200px" placeholder="Search a name or email..." value="' + esc(filter.q) + '">' +
        '<label class="check small"><input type="checkbox" id="u-special"' + (filter.special ? ' checked' : '') + '> Only people with special access</label><span class="small muted" id="u-count"></span></div>' +
        '<div class="table-wrap"><table class="t perm-table"><thead><tr><th>User</th>' + cols.map(function (c) { return '<th class="c">' + esc(c.label) + '</th>'; }).join('') + '<th></th></tr></thead>' +
        '<tbody>' + d.users.map(rowHtml).join('') + '</tbody></table></div></div>';

      function special(u) { return u.isMainAdmin || u.blocked || perms.some(function (p) { return u.perms[p.key]; }); }
      function applyFilter() {
        var q = filter.q.trim().toLowerCase();
        var shown = 0;
        d.users.forEach(function (u, i) {
          var visible = (!q || (u.name + ' ' + u.email).toLowerCase().indexOf(q) !== -1) && (!filter.special || special(u));
          el.querySelector('tr[data-row="' + i + '"]').style.display = visible ? '' : 'none';
          if (visible) shown++;
        });
        document.getElementById('u-count').textContent = shown + ' of ' + d.users.length + ' people';
      }
      applyFilter();
      document.getElementById('u-q').addEventListener('input', function (ev) { filter.q = ev.target.value; applyFilter(); });
      document.getElementById('u-special').addEventListener('change', function (ev) { filter.special = ev.target.checked; applyFilter(); });

      function readRow(i) {
        var out = { perms: {}, blocked: false };
        el.querySelectorAll('.perm-box[data-i="' + i + '"]').forEach(function (b) {
          if (b.getAttribute('data-k') === 'BLOCKED') out.blocked = b.checked;
          else out.perms[b.getAttribute('data-k')] = b.checked;
        });
        return out;
      }
      el.querySelectorAll('.perm-box').forEach(function (box) {
        box.addEventListener('change', function () {
          var i = box.getAttribute('data-i');

            el.querySelectorAll('.perm-box[data-i="' + i + '"]').forEach(function (b) {
              var k = b.getAttribute('data-k');
              if (k === 'ADMIN' || k === 'BLOCKED') return;

          el.querySelector('[data-save="' + i + '"]').disabled = false;
        });
      });
      el.querySelectorAll('[data-save]').forEach(function (b) {
        b.onclick = function () {
          var i = Number(b.getAttribute('data-save'));
          var u = d.users[i];
          var r = readRow(i);
          b.disabled = true;
          api('saveUser', { email: u.email, perms: r.perms, blocked: r.blocked }).then(function () {

          });
        };
      });
      document.getElementById('u-add-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var f = ev.target;
        var p = {};
        perms.forEach(function (x) { p[x.key] = f['p_' + x.key].checked; });
        api('saveUser', { email: f.email.value, name: f.name.value, subsidiary: f.subsidiary.value, perms: p, blocked: false }).then(function (r) {
          toast(r.email + ' can now sign in.');
          go('users');
        }).catch(fail);
      });
    });
  };

        var values = {};
        d.settings.forEach(function (s) { values[s.key] = ev.target[s.key].value; });
        api('saveSettings', { values: values }).then(function (r) { toast(r.changed.length ? 'Settings saved.' : 'Nothing changed.'); if (r.changed.length) start(); }).catch(fail);
      });
    });
  };

  var SOON = {
    bsp: ['BSP tracking', 'Follow IATA BSP billing and remittance for every subsidiary in one place.', ['BSP billing periods and remittance due dates', 'Amounts due per subsidiary and per airline', 'Reminders before each remittance deadline', 'Reconciliation status for each period']],
    receivables: ['Receivables', 'See what customers owe across the group and how old it is.', ['Outstanding balances by subsidiary and customer', 'Ageing buckets (0 to 30, 31 to 60, 61 to 90, over 90 days)', 'Collections progress against target', 'Exports for month end']],
    credit: ['Credit control', 'Manage credit limits and keep corporate accounts within terms.', ['Credit limits and terms per corporate client', 'Alerts when an account goes over its limit', 'Promise to pay and follow up notes', 'Accounts on hold list shared with sales']],
    invoices: ['Invoices', 'Track invoices raised by each subsidiary from issue to payment.', ['Invoice register with status (issued, sent, part paid, paid)', 'Invoices priced at the ROE in force when they were raised', 'Overdue invoice reminders', 'Search by client, subsidiary or invoice number']]
  };
  function viewSoon(el, id) {
    var s = SOON[id];
    var item = navItem(id).item;
    el.innerHTML = '<div class="card soon-hero"><div class="icon">' + icon(item.icon) + '</div><span class="badge warn">Coming soon</span>' +
      '<h2 style="margin:12px 0 6px">' + esc(s[0]) + '</h2><p class="muted" style="margin:0">' + esc(s[1]) + '</p>' +
      '<ul>' + s[2].map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  }

  /* ---------- light / dark switch ---------- */
  var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function activeTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    return darkQuery && darkQuery.matches ? 'dark' : 'light';
  }
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  function paintToggle() {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var dark = activeTheme() === 'dark';
    // Show the mode you will switch to.
    btn.innerHTML = dark ? SUN : MOON;
    var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  }
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { window.localStorage.setItem('fp_theme', theme); } catch (e) { /* storage blocked */ }
    paintToggle();
    // Charts read their colours when drawn, so redraw the page they are on.
    if (S.charts.length && S.boot) go(S.view);
  }
  var toggleBtn = document.getElementById('theme-toggle');
  if (toggleBtn) toggleBtn.addEventListener('click', function () { setTheme(activeTheme() === 'dark' ? 'light' : 'dark'); });
  if (darkQuery && darkQuery.addEventListener) {
    darkQuery.addEventListener('change', function () {
      if (!document.documentElement.getAttribute('data-theme')) { paintToggle(); if (S.charts.length && S.boot) go(S.view); }
    });
  }
  paintToggle();

  /* ---------- boot ---------- */
  api('config').then(function (c) {
    S.config = c;
    var t = store.get('fp_token');
    if (t) { S.token = t; start(); } else renderLogin('email');
  }).catch(function () { renderLogin('email'); });
})();
</script>
</body>
</html>
