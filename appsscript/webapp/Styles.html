<style>
/* TVD OTA FareIQ dashboard
 *
 * Single theme, deliberately. The brand lives on white and the app is used in
 * a lit office at 07:00; a dark variant would be a second surface to validate
 * for no one who asked.
 *
 * Two colour systems, kept apart on purpose:
 *   CHROME   navy/green/orange from the TravelDen lockup, for the interface.
 *   SERIES   a separate, CVD-validated categorical ramp for data marks.
 * Chart marks never borrow a chrome colour and text never wears a series
 * colour: a mark beside the label carries identity instead.
 */
:root{
  /* chrome */
  --navy:#002A48; --green:#00A651; --dgreen:#00502A; --orange:#F58220;
  --sky:#8ED8F8; --rust:#A42B20;
  --ink:#17262F; --ink2:#3C4E58; --mute:#5E7079; --faint:#8C9AA2;
  --rule:#DCE5E1; --rule2:#C6D3CC;
  --tint:#F2F7F4; --tint2:#EEF3F7; --surface:#FFFFFF; --ground:#F7F9F8;

  /* validated categorical series ramp: assign in this order, never cycled */
  --s1:#15618F; --s2:#F58220; --s3:#0F7A4C; --s4:#2E9BD4; --s5:#9C2B22;

  /* status: reserved, always shipped with a text label, never colour alone */
  --good:#0F7A4C; --good-bg:#E6F2EB;
  --warn:#B26A00; --warn-bg:#FBF0DF;
  --crit:#9C2B22; --crit-bg:#F8E7E5;
  --neutral:#5E7079; --neutral-bg:#EDF1F0;

  --f-body:Garamond,"EB Garamond",Georgia,"Times New Roman",serif;
  --f-ui:"Helvetica Neue",Arial,sans-serif;
  --f-num:"SF Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--green); outline-offset:2px; border-radius:3px}

/* ---------------------------------------------------------- top bar */
.topbar{
  display:flex; align-items:center; gap:24px;
  background:var(--navy); color:#fff; padding:0 20px; height:56px;
  position:sticky; top:0; z-index:40;
}
.brand{display:flex; align-items:baseline; gap:9px; flex:none}
.brand .mark{
  width:16px; height:16px; border-radius:50% 50% 50% 4px;
  background:linear-gradient(135deg,var(--green) 45%,var(--orange) 45%);
  transform:translateY(2px); display:inline-block;
}
.wordmark{font-family:var(--f-ui); font-size:19px; letter-spacing:-.3px; font-weight:300}
.wordmark em{font-style:normal; color:var(--orange); font-weight:500}
.product{
  font-family:var(--f-ui); font-size:10px; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--sky); padding-left:9px; margin-left:3px; border-left:1px solid rgba(255,255,255,.22);
}
.tabs{display:flex; gap:2px; flex:1; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font-family:var(--f-ui); font-size:12.5px; color:#B9CCD9; background:none; border:0;
  padding:7px 13px; border-radius:4px; cursor:pointer; white-space:nowrap;
}
.tab:hover{background:rgba(255,255,255,.08); color:#fff}
.tab[aria-selected="true"]{background:rgba(255,255,255,.14); color:#fff; font-weight:600}
.who{display:flex; align-items:center; gap:14px; flex:none}
.freshness{
  font-family:var(--f-ui); font-size:11px; color:var(--sky);
  background:rgba(255,255,255,.09); padding:4px 9px; border-radius:11px;
}
.freshness.stale{background:rgba(244,140,40,.22); color:#FFD0A3}
.user{font-family:var(--f-ui); font-size:11.5px; color:#9FBACB}

/* ---------------------------------------------------------- layout */
main{padding:22px 20px 40px; max-width:1560px; margin:0 auto}
.loading{display:flex; align-items:center; gap:10px; color:var(--mute); padding:60px 0; justify-content:center}
.spinner{
  width:15px; height:15px; border:2px solid var(--rule2); border-top-color:var(--green);
  border-radius:50%; animation:spin .8s linear infinite; display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:16px; flex-wrap:wrap}
.pagehead h1{font-size:25px; font-weight:600; margin:0; letter-spacing:-.2px; color:var(--navy)}
.pagehead p{margin:3px 0 0; color:var(--mute); font-size:13.5px; max-width:66ch}

.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); margin-bottom:16px}

/* ---------------------------------------------------------- panels */
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:16px 18px 18px}
.panel h2{
  font-family:var(--f-ui); font-size:11px; letter-spacing:1.3px; text-transform:uppercase;
  color:var(--mute); margin:0 0 3px; font-weight:600;
}
.panel .sub{font-size:12.5px; color:var(--mute); margin:0 0 12px}
.chart{width:100%; height:270px}
.chart.tall{height:330px}

/* stat tiles: the headline numbers, not a card for every block */
.tile{background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:13px 15px 14px}
.tile .k{font-family:var(--f-ui); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--mute)}
.tile .v{font-size:27px; font-weight:600; line-height:1.15; margin-top:3px; font-variant-numeric:tabular-nums; color:var(--navy)}
.tile .v.accent{color:var(--orange)}
.tile .v.good{color:var(--good)}
.tile .v.crit{color:var(--crit)}
.tile .d{font-size:11.5px; color:var(--mute); margin-top:2px}

/* ---------------------------------------------------------- tables */
.tablewrap{overflow:auto; max-height:min(64vh,720px); border:1px solid var(--rule); border-radius:6px; background:var(--surface)}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
thead th{
  position:sticky; top:0; z-index:2; background:var(--navy); color:#fff;
  font-family:var(--f-ui); font-size:9.5px; letter-spacing:1px; text-transform:uppercase;
  font-weight:600; text-align:left; padding:9px 10px; white-space:nowrap;
}
thead th.num{text-align:right}
tbody td{padding:8px 10px; border-bottom:1px solid var(--rule); vertical-align:middle}
tbody tr:hover td{background:var(--tint)}
tbody tr.sel td{background:#E8F3EC}
td.num{text-align:right; font-family:var(--f-num); font-size:12px; font-variant-numeric:tabular-nums}
td.route{font-weight:600; color:var(--navy); white-space:nowrap}
.empty{padding:34px; text-align:center; color:var(--mute)}

/* selective direct-label bar inside a cell, never a bar on every column */
.databar{position:relative; display:block; height:3px; border-radius:2px; background:var(--rule); margin-top:3px}
.databar i{position:absolute; left:0; top:0; height:100%; border-radius:2px; background:var(--s1); display:block}
.databar.neg i{background:var(--s5)}

/* ---------------------------------------------------------- chips */
.chip{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--f-ui);
  font-size:9.5px; font-weight:700; letter-spacing:.5px; padding:3px 7px; border-radius:3px;
  white-space:nowrap;
}
.chip::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.c-good{background:var(--good-bg); color:var(--good)}
.c-warn{background:var(--warn-bg); color:var(--warn)}
.c-crit{background:var(--crit-bg); color:var(--crit)}
.c-neutral{background:var(--neutral-bg); color:var(--neutral)}

/* ---------------------------------------------------------- controls */
.controls{display:flex; flex-wrap:wrap; gap:9px; align-items:flex-end; margin-bottom:14px}
.ctl{display:flex; flex-direction:column; gap:3px}
.ctl label{font-family:var(--f-ui); font-size:9.5px; letter-spacing:.9px; text-transform:uppercase; color:var(--mute)}
select,input[type="date"],input[type="number"],textarea{
  font-family:var(--f-ui); font-size:13px; color:var(--ink); background:var(--surface);
  border:1px solid var(--rule2); border-radius:4px; padding:6px 9px; min-width:128px;
}
textarea{font-family:var(--f-body); font-size:14px; width:100%; resize:vertical}
.spacer{flex:1}

.btn{
  font-family:var(--f-ui); font-size:12.5px; font-weight:600; border-radius:4px;
  padding:7px 14px; cursor:pointer; border:1px solid transparent; background:var(--surface);
}
.btn.primary{background:var(--green); color:#fff}
.btn.primary:hover{background:#00934A}
.btn.ghost{border-color:var(--rule2); color:var(--ink2)}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{border-color:var(--crit); color:var(--crit)}
.btn.danger:hover{background:var(--crit-bg)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{font-size:11px; padding:4px 9px}
.rowbtns{display:flex; gap:4px; white-space:nowrap}

/* ---------------------------------------------------------- banner */
.banner{
  margin:0 20px 14px; padding:11px 15px; border-radius:5px; font-size:13.5px;
  background:var(--warn-bg); color:#6B4000; border:1px solid #E7C98F;
}
.banner.err{background:var(--crit-bg); color:#6E1F19; border-color:#E0A8A2}
.banner.ok{background:var(--good-bg); color:#10502F; border-color:#A9CDB8}

/* ---------------------------------------------------------- modal */
.scrim{position:fixed; inset:0; background:rgba(0,26,42,.5); display:flex;
  align-items:center; justify-content:center; z-index:60; padding:20px}
.modal{background:var(--surface); border-radius:8px; padding:22px 24px; width:min(460px,100%);
  box-shadow:0 18px 46px rgba(0,26,42,.3)}
.modal h3{margin:0 0 3px; font-size:19px; color:var(--navy)}
.modal-sub{margin:0 0 16px; color:var(--mute); font-size:13px}
.field{display:block; margin-bottom:14px}
.field>span{display:block; font-family:var(--f-ui); font-size:10px; letter-spacing:.9px;
  text-transform:uppercase; color:var(--mute); margin-bottom:4px}
.field input{width:100%}
.field small{display:block; color:var(--mute); font-size:11.5px; margin-top:4px}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px}

/* ---------------------------------------------------------- misc */
.foot{padding:16px 20px 26px; color:var(--mute); font-size:12px; display:flex;
  justify-content:space-between; gap:20px; flex-wrap:wrap; max-width:1560px; margin:0 auto}
.foot a{color:var(--dgreen)}
.rationale{font-size:12.5px; color:var(--ink2); max-width:52ch; line-height:1.45}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:9px; font-family:var(--f-ui); font-size:11.5px; color:var(--ink2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:11px; height:3px; border-radius:2px; display:inline-block}
.note{font-size:12px; color:var(--mute); margin-top:9px; line-height:1.45}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

@media (max-width:820px){
  .topbar{height:auto; flex-wrap:wrap; padding:10px 14px; gap:10px}
  .who{width:100%; justify-content:space-between}
  main{padding:16px 14px 32px}
  .chart{height:230px}
}
</style>
