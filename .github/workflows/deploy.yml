name: tvd-ota-fareiq-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  BQ_LOCATION: ${{ vars.BQ_LOCATION }}
  AR_REPO: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/tvd-ota-fareiq

jobs:
  # ------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src services tests
      - name: Types
        run: mypy src --ignore-missing-imports
      - name: Unit tests
        run: pytest tests -v --cov=fareiq --cov-report=term-missing --cov-fail-under=80

  # ------------------------------------------------------------------
  # SQL is code. It gets a dry run against real BigQuery on every PR, which
  # catches schema drift and syntax errors before they reach the morning run.
  sql-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Dry run every query
        run: |
          set -euo pipefail
          fail=0
          for f in $(find sql -name '*.sql' | sort); do
            echo "-- checking $f"
            rendered=$(mktemp)
            sed -e "s|\${PROJECT}|${GCP_PROJECT}|g" \
                -e "s|\${BQ_LOCATION}|${BQ_LOCATION}|g" \
                -e "s|\${CHANGE_PROBABILITY}|0.08|g" \
                -e "s|\${CANCEL_PROBABILITY}|0.03|g" \
                -e "s|\${BASELINE_STOPS}|0|g" \
                -e "s|\${STOP_PENALTY_BASE}|6000|g" \
                -e "s|\${OUTLIER_ABS_CEILING}|20000000|g" \
                -e "s|\${EXPECTED_PANEL_SIZE}|5|g" \
                -e "s|\${ELASTICITY_SHRINK_K}|20|g" \
                -e "s|\${DEFAULT_ELASTICITY}|-6.0|g" \
                -e "s|\${ELASTICITY_CEILING}|-0.5|g" \
                -e "s|\${ELASTICITY_FLOOR}|-18.0|g" "$f" > "$rendered"
            bq query --use_legacy_sql=false --dry_run \
                     --location="${BQ_LOCATION}" --project_id="${GCP_PROJECT}" \
                     < "$rendered" || fail=1
          done
          exit $fail

  # ------------------------------------------------------------------
  build-deploy:
    needs: [quality, sql-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # dir is the folder under services/; name is the Cloud Run service.
        # Cloud Run names may not contain underscores.
        include:
          - dir: collector_svc
            name: tvd-ota-fareiq-collector
          - dir: pricing_svc
            name: tvd-ota-fareiq-pricing
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build
        run: |
          docker build -f services/${{ matrix.dir }}/Dockerfile \
            -t ${AR_REPO}/${{ matrix.dir }}:${GITHUB_SHA} \
            -t ${AR_REPO}/${{ matrix.dir }}:latest .
          docker push ${AR_REPO}/${{ matrix.dir }}:${GITHUB_SHA}
          docker push ${AR_REPO}/${{ matrix.dir }}:latest

      # Deploy with no traffic, smoke test the new revision, then promote.
      # A bad pricing engine must never reach the morning run.
      - name: Deploy candidate revision
        run: |
          gcloud run deploy ${{ matrix.name }} \
            --image=${AR_REPO}/${{ matrix.dir }}:${GITHUB_SHA} \
            --region=${GCP_REGION} \
            --no-allow-unauthenticated \
            --service-account=${{ matrix.name }}-sa@${GCP_PROJECT}.iam.gserviceaccount.com \
            --set-env-vars=GCP_PROJECT=${GCP_PROJECT},BQ_LOCATION=${BQ_LOCATION},GIT_SHA=${GITHUB_SHA},RAW_BUCKET=${{ vars.RAW_BUCKET }} \
            --memory=2Gi --cpu=2 --timeout=900 --concurrency=8 \
            --min-instances=0 --max-instances=20 \
            --no-traffic --tag=candidate

      - name: Smoke test the candidate
        run: |
          URL=$(gcloud run services describe ${{ matrix.name }} \
                  --region=${GCP_REGION} --format='value(status.traffic[0].url)')
          CAND=$(gcloud run revisions list --service=${{ matrix.name }} \
                  --region=${GCP_REGION} --limit=1 --format='value(status.url)')
          TOKEN=$(gcloud auth print-identity-token)
          curl -sf -H "Authorization: Bearer ${TOKEN}" "${CAND}/healthz" | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Promote
        run: |
          gcloud run services update-traffic ${{ matrix.name }} \
            --region=${GCP_REGION} --to-latest

  # ------------------------------------------------------------------
  apply-sql:
    needs: build-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply DDL and views
        run: bash deploy/apply_sql.sh

  # ------------------------------------------------------------------
  deploy-appsscript:
    needs: apply-sql
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g @google/clasp
      - name: Push Apps Script
        run: |
          echo "${{ secrets.CLASPRC_JSON }}" > ~/.clasprc.json
          cd appsscript && clasp push --force
